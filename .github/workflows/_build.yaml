# Reusable build: compiles devbench.dll with xmake (releasedbg) and the standalone
# devbench-bridge.exe (bun compile), uploading each as its own artifact. Called by
# build.yaml (CI) and release.yaml (packaging), so the toolchain is defined in
# exactly one place.
name: "_build"

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name for the uploaded binaries artifact."
        type: string
        default: devbench-binaries
      ref:
        description: "Git ref to build. Empty = the triggering commit (CI default)."
        type: string
        default: ""
    outputs:
      artifact-name:
        description: "Artifact name the binaries were uploaded under."
        value: ${{ inputs.artifact-name }}
      bridge-artifact-name:
        description: "Artifact name the bridge exe was uploaded under."
        value: ${{ inputs.artifact-name }}-bridge

permissions:
  contents: read

jobs:
  build:
    name: Build (xmake · releasedbg)
    runs-on: windows-2025
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # CommonLibSSE-NG itself is compiled in-tree (not a cached package), but its
      # xmake-resolved deps (fmt, spdlog, …) and nlohmann_json are — cache them keyed
      # on the lockfile so only a dep bump invalidates the cache.
      - name: Cache xmake packages
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake/packages
            ~/AppData/Local/.xmake/cache
          key: xmake-${{ runner.os }}-${{ hashFiles('xmake-requires.lock') }}
          restore-keys: |
            xmake-${{ runner.os }}-

      - name: Update xmake package repo
        run: xmake repo --update

      - name: Configure
        run: xmake config --mode=releasedbg --yes --verbose

      - name: Build
        run: xmake build --yes devbench

      # Host-independent unit tests (ToolRegistry dispatch + MCP content-shape
      # contract). Builds without CommonLibSSE-NG, so it's cheap and gates both CI
      # and release packaging on the pure-logic seams.
      - name: Build & run unit tests
        run: |
          xmake build --yes devbench-tests
          xmake run devbench-tests

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check camera test safety without a game
        env:
          DEVBENCH_TEST_FREECAM: "0"
        run: |
          python -m pip install "pytest>=7.0" "requests>=2.28"
          python -m pytest tests/http/test_camera_freecam_safety.py tests/http/test_camera_freecam.py -q

      - name: Stage binaries
        shell: pwsh
        run: |
          $out = "build/windows/x64/releasedbg"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "$out/devbench.dll" staging/
          Copy-Item "$out/devbench.pdb" staging/

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: staging/*
          if-no-files-found: error

  bridge:
    name: Build bridge (bun compile)
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # npm ci (not bun install) so the compiled exe bundles the exact dependency
      # versions pinned in package-lock.json — the same lockfile lint.yaml installs
      # from for eslint. bun is only the compiler here, not the package manager.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install bridge dependencies
        working-directory: bridge
        run: npm ci

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Compile standalone exe
        working-directory: bridge
        run: bun run compile

      - name: Upload bridge binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-bridge
          path: bridge/dist/devbench-bridge.exe
          if-no-files-found: error
