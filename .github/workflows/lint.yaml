# Lint: runs the repo's pre-commit hooks (clang-format, prettier, stylua, the
# pre-commit-hooks set) in CI so formatting is enforced on PRs, not just locally.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # eslint-bridge (a local pre-commit hook, skipped on pre-commit.ci — see
      # .pre-commit-config.yaml) needs bridge/node_modules/.bin/eslint on disk;
      # everything else is fetched by the hook repos themselves.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
        working-directory: bridge

      - uses: pre-commit/action@v3.0.1
